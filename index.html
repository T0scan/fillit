<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fill It!</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0d0f17;
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        z-index: 10;
      }
      .ui-top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }
      .hud-card {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 12px 20px;
        color: #f8fafc;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        pointer-events: auto;
      }
      .hud-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #94a3b8;
        margin-bottom: 4px;
        font-weight: 600;
      }
      .hud-value {
        font-size: 24px;
        font-weight: 700;
        color: #38bdf8;
      }
      .btn {
        pointer-events: auto;
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        color: #f8fafc;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      }
      .btn:hover {
        background: rgba(30, 41, 59, 0.9);
        border-color: rgba(56, 189, 248, 0.5);
        transform: translateY(-2px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .ui-bottom-bar {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .controls-hint {
        font-size: 13px;
        color: #94a3b8;
        background: rgba(15, 23, 42, 0.6);
        padding: 8px 16px;
        border-radius: 20px;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .kbd {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        padding: 2px 6px;
        font-family: monospace;
        font-weight: bold;
        color: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="ui-overlay">
      <div class="ui-top-bar">
        <div class="hud-card">
          <div class="hud-title">Coverage</div>
          <div class="hud-value" id="fill-percentage">0.0%</div>
        </div>
        <button id="fullscreen-btn" class="btn" aria-label="Toggle Fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
          <span>Fullscreen</span>
        </button>
      </div>
      <div class="ui-bottom-bar">
        <div class="controls-hint">
          Move: <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> or <span class="kbd">↑</span><span class="kbd">←</span><span class="kbd">↓</span><span class="kbd">→</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
